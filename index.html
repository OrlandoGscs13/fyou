<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para tí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#24102d;--bg2:#67264f;--pink:#ffd6e3;--accent:#ff7399;--text:#fff0f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:28px 16px 36px;text-align:center;color:var(--text);
  font-family:Quicksand,system-ui,sans-serif;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 18%,var(--bg2),var(--bg1) 72%);
}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
.petal{position:fixed;top:-30px;z-index:1;pointer-events:none;background:radial-gradient(circle at 30% 30%,#fff0f5,#ff6b91);border-radius:150% 0 150% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(35px,55vh,0) rotate(200deg)}100%{transform:translate3d(-25px,110vh,0) rotate(420deg)}}
main{position:relative;z-index:2;width:100%;max-width:560px}
h1{font:700 clamp(3.4rem,12vw,5.5rem)/1.05 'Dancing Script',cursive;color:var(--pink);text-shadow:0 0 26px #ff6b8b88;animation:fadeup 1.2s both}
.subtitle{font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;color:#ffd9e5b8;margin-top:9px;animation:fadeup 1.2s .25s both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.bouquet{width:min(440px,94vw);margin:0 auto;filter:drop-shadow(0 18px 22px #0005);animation:sway 6s ease-in-out 3s infinite;transform-origin:50% 92%}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.flower{transform-box:fill-box;transform-origin:center;animation:floweropen 1.1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes floweropen{from{opacity:0;transform:scale(.15) rotate(-35deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.stem{fill:none;stroke:#398d51;stroke-width:4;stroke-linecap:round}
.leaf{fill:url(#leaf);stroke:#287443;stroke-width:1.2}
.message{
  max-width:460px;margin:8px auto 0;min-height:110px;padding:18px 22px;
  border:1px solid #ffd6e32e;border-radius:22px;background:#ffffff08;
  box-shadow:inset 0 1px #ffffff0a;line-height:1.8;font-size:1.08rem;
  color:#fff0f5;white-space:pre-wrap;animation:fadeup 1.2s 1s both;
}
@media(max-height:760px){body{align-items:flex-start}.bouquet{width:min(360px,78vw)}.message{margin-top:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<main>
  <h1>Para tí 💗</h1>
  <p class="subtitle"></p>

  <svg class="bouquet" viewBox="0 0 440 510" role="img" aria-label="Ramo detallado de rosas y flores rosadas">
    <defs>
      <radialGradient id="roseA" cx="30%" cy="25%" r="80%">
        <stop offset="0" stop-color="#ffd3df"/><stop offset=".45" stop-color="#ff739b"/><stop offset="1" stop-color="#b92359"/>
      </radialGradient>
      <radialGradient id="roseB" cx="28%" cy="25%" r="80%">
        <stop offset="0" stop-color="#fff0f5"/><stop offset=".55" stop-color="#f8a1c1"/><stop offset="1" stop-color="#b84a83"/>
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8cdb91"/><stop offset="1" stop-color="#207244"/>
      </linearGradient>
      <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe6ee"/><stop offset=".55" stop-color="#f6a9c5"/><stop offset="1" stop-color="#bd527e"/>
      </linearGradient>
      <linearGradient id="wrapLight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff2f6"/><stop offset="1" stop-color="#f5bad0"/>
      </linearGradient>
      <g id="rose">
        <g fill="url(#roseA)" stroke="#a62d59" stroke-opacity=".4" stroke-width="1.1">
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(0)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(45)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(90)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(135)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(180)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(225)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(270)"/>
          <ellipse cy="-17" rx="13" ry="22" transform="rotate(315)"/>
        </g>
        <g fill="url(#roseB)" stroke="#b83d70" stroke-opacity=".5" stroke-width="1">
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(22)"/>
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(82)"/>
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(142)"/>
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(202)"/>
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(262)"/>
          <ellipse cy="-10" rx="9" ry="15" transform="rotate(322)"/>
        </g>
        <path d="M-5 -2 C-12 -12 2 -22 8 -12 C14 -3 2 5 -5 -2Z" fill="#d83d72"/>
        <path d="M-2 -3 C-5 -8 2 -12 5 -7 C8 -2 1 1 -2 -3Z" fill="#ffb4cb"/>
        <circle cx="-9" cy="-21" r="3" fill="#fff" opacity=".5"/>
      </g>
      <g id="daisy">
        <g fill="#fff0f6" stroke="#e8a0bd" stroke-width="1">
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(0)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(30)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(60)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(90)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(120)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(150)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(180)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(210)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(240)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(270)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(300)"/>
          <ellipse cy="-19" rx="6.5" ry="17" transform="rotate(330)"/>
        </g>
        <circle r="10" fill="#ffca45" stroke="#e99a20" stroke-width="1.5"/>
        <circle r="5" fill="#f4a21e"/>
        <g fill="#fff6bf" opacity=".85"><circle cx="-3" cy="-3" r="1.3"/><circle cx="3" cy="2" r="1.2"/><circle cx="1" cy="-4" r="1"/></g>
      </g>
      <g id="smallflower">
        <g fill="#f5a6d0" stroke="#d66ca7" stroke-width="1">
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(0)"/>
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(60)"/>
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(120)"/>
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(180)"/>
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(240)"/>
          <ellipse cy="-12" rx="5" ry="12" transform="rotate(300)"/>
        </g><circle r="4.5" fill="#ffd76c"/>
      </g>
    </defs>

    <g class="stem">
      <path d="M220 390 Q190 285 95 170"/><path d="M220 390 Q235 270 220 112"/>
      <path d="M220 390 Q260 270 340 175"/><path d="M220 390 Q170 310 150 230"/>
      <path d="M220 390 Q285 310 300 245"/><path d="M220 390 Q220 290 220 215"/>
      <path d="M220 390 Q135 340 92 280"/><path d="M220 390 Q300 345 355 280"/>
    </g>
    <g>
      <path class="leaf" d="M174 326 Q118 320 126 270 Q171 280 174 326Z"/><path d="M172 322L135 282" stroke="#b1e6a9" fill="none"/>
      <path class="leaf" d="M252 337 Q309 327 311 281 Q269 286 252 337Z"/><path d="M256 333L300 291" stroke="#b1e6a9" fill="none"/>
      <path class="leaf" d="M153 285 Q100 271 111 225 Q151 239 153 285Z"/><path d="M151 281L119 238" stroke="#b1e6a9" fill="none"/>
      <path class="leaf" d="M282 286 Q333 269 326 227 Q288 239 282 286Z"/><path d="M285 281L319 240" stroke="#b1e6a9" fill="none"/>
      <path class="leaf" d="M195 357 Q151 374 130 342 Q164 324 195 357Z"/><path d="M190 356L140 346" stroke="#b1e6a9" fill="none"/>
      <path class="leaf" d="M245 359 Q289 376 309 342 Q277 324 245 359Z"/><path d="M250 356L300 346" stroke="#b1e6a9" fill="none"/>
    </g>

    <g class="flower" style="animation-delay:.2s"><use href="#rose" transform="translate(220 100) scale(1.55)"/></g>
    <g class="flower" style="animation-delay:.45s"><use href="#rose" transform="translate(130 160) scale(1.3)"/></g>
    <g class="flower" style="animation-delay:.65s"><use href="#rose" transform="translate(310 160) scale(1.3)"/></g>
    <g class="flower" style="animation-delay:.85s"><use href="#rose" transform="translate(215 205) scale(1.2)"/></g>
    <g class="flower" style="animation-delay:1s"><use href="#daisy" transform="translate(75 225) scale(1.15)"/></g>
    <g class="flower" style="animation-delay:1.15s"><use href="#daisy" transform="translate(360 225) scale(1.08)"/></g>
    <g class="flower" style="animation-delay:1.3s"><use href="#daisy" transform="translate(155 255) scale(.9)"/></g>
    <g class="flower" style="animation-delay:1.45s"><use href="#daisy" transform="translate(280 260) scale(.95)"/></g>
    <g class="flower" style="animation-delay:1.6s"><use href="#smallflower" transform="translate(110 295) scale(1.1)"/></g>
    <g class="flower" style="animation-delay:1.7s"><use href="#smallflower" transform="translate(335 295) scale(1.1)"/></g>

    <path d="M78 350 Q220 382 362 350 L275 482 Q220 510 165 482Z" fill="#a94372" opacity=".85"/>
    <path d="M91 345 Q220 374 349 345 L276 480 Q220 498 164 480Z" fill="url(#wrap)"/>
    <path d="M108 350 L183 489 L164 480 L91 345Z" fill="url(#wrapLight)" opacity=".85"/>
    <path d="M332 350 L257 489 L276 480 L349 345Z" fill="#df7fa5" opacity=".8"/>
    <path d="M220 374 L220 494 M146 360L190 488 M294 360L250 488" stroke="#bd5c86" stroke-width="1.5" opacity=".45" fill="none"/>
    <path d="M218 391 C170 350 139 385 169 414 C191 430 209 408 218 391Z" fill="#e63b75" stroke="#b82a5c" stroke-width="1.5"/>
    <path d="M222 391 C270 350 301 385 271 414 C249 430 231 408 222 391Z" fill="#ff78a0" stroke="#b82a5c" stroke-width="1.5"/>
    <path d="M216 397 L185 452 L211 439 L222 461 L228 400Z" fill="#c72d64"/>
    <path d="M224 397 L255 452 L229 439 L218 461 L212 400Z" fill="#e94e83"/>
    <ellipse cx="220" cy="394" rx="13" ry="12" fill="#ff8fb0" stroke="#c72d64" stroke-width="1.5"/>
    <ellipse cx="216" cy="390" rx="4" ry="3" fill="#fff" opacity=".55"/>
  </svg>

  <div class="message" id="mensaje"> <p>NO SÉ SI ESTÁS ENOJADA CONMIGO Y NO ME LO QUIERES DECIR, PERO EN SERIO ME GUSTA MUCHO HABLAR CONTIGO AUNQUE NO LO CREAS. TAL VÉZ ESTÁS HABLANDO CON ALGUIEN MÁS Y TE MOLESTA QUE TE ESCRIBA ASÍ QUE TRATARÉ DE YA NO MOLESTARTE MÁS.</p> </div>
</main>
<script>
  const stars = document.getElementById('stars');
  for (let i=0; i<48; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = Math.random()*3+'s';
    s.style.transform = `scale(${.5+Math.random()})`;
    stars.appendChild(s);
  }
  for (let i=0; i<13; i++) {
    const p = document.createElement('div');
    p.className='petal';
    const size=9+Math.random()*10;
    p.style.width=p.style.height=size+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=8+Math.random()*7+'s';
    p.style.animationDelay=Math.random()*10+'s';
    document.body.appendChild(p);
  }
</script>
</body>
</html>
